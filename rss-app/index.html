<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6750a4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141218" media="(prefers-color-scheme: dark)">
  <title>Akış · RSS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@300..900&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..700,0..1,-50..200&display=swap">
  <!-- Material 3 Expressive design tokens: color, shape (incl. the "increased" corners), motion and type -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@material/web@2.5.0/labs/gb/styles/m3.css">
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
  {
    "imports": {
      "lit": "https://cdn.jsdelivr.net/npm/lit@3.3.3/index.js",
      "lit/": "https://cdn.jsdelivr.net/npm/lit@3.3.3/",
      "lit-html": "https://cdn.jsdelivr.net/npm/lit-html@3.3.3/lit-html.js",
      "lit-html/": "https://cdn.jsdelivr.net/npm/lit-html@3.3.3/",
      "lit-element": "https://cdn.jsdelivr.net/npm/lit-element@4.2.2/index.js",
      "lit-element/": "https://cdn.jsdelivr.net/npm/lit-element@4.2.2/",
      "@lit/reactive-element": "https://cdn.jsdelivr.net/npm/@lit/reactive-element@2.1.2/reactive-element.js",
      "@lit/reactive-element/": "https://cdn.jsdelivr.net/npm/@lit/reactive-element@2.1.2/",
      "tslib": "https://cdn.jsdelivr.net/npm/tslib@2.8.1/tslib.es6.js",
      "@lit/context": "https://cdn.jsdelivr.net/npm/@lit/context@1.1.6/index.js",
      "@lit/context/": "https://cdn.jsdelivr.net/npm/@lit/context@1.1.6/",
      "@material/web/": "https://cdn.jsdelivr.net/npm/@material/web@2.5.0/"
    }
  }
  </script>
</head>
<body>
  <md-linear-progress id="progress" indeterminate hidden></md-linear-progress>

  <header class="top">
    <h1 id="title">Akış</h1>
    <md-icon-button id="refresh" aria-label="Yenile">
      <span class="material-symbols-rounded">refresh</span>
    </md-icon-button>
  </header>

  <main>
    <md-chip-set id="chips" aria-label="Kaynak filtresi"></md-chip-set>
    <section id="hero"></section>
    <section id="grid" class="grid"></section>
    <md-list id="feeds" hidden></md-list>
    <p id="empty" class="empty" hidden></p>
  </main>

  <div class="float-bar" id="float" role="toolbar" aria-label="Hızlı işlemler">
    <md-icon-button class="extra" id="tb-read" aria-label="Hepsini okundu işaretle">
      <span class="material-symbols-rounded">done_all</span>
    </md-icon-button>
    <md-icon-button id="tb-top" aria-label="Başa dön">
      <span class="material-symbols-rounded">arrow_upward</span>
    </md-icon-button>
  </div>

  <md-navigation-bar id="nav" activeIndex="0">
    <md-navigation-tab label="Akış" data-view="stream">
      <span slot="active-icon" class="material-symbols-rounded">feed</span>
      <span slot="inactive-icon" class="material-symbols-rounded">feed</span>
    </md-navigation-tab>
    <md-navigation-tab label="Kaydedilen" data-view="saved">
      <span slot="active-icon" class="material-symbols-rounded">bookmark</span>
      <span slot="inactive-icon" class="material-symbols-rounded">bookmark</span>
    </md-navigation-tab>
    <md-navigation-tab label="Kaynaklar" data-view="feeds">
      <span slot="active-icon" class="material-symbols-rounded">rss_feed</span>
      <span slot="inactive-icon" class="material-symbols-rounded">rss_feed</span>
    </md-navigation-tab>
  </md-navigation-bar>

  <md-fab id="add" class="fab" label="Kaynak ekle" hidden>
    <span slot="icon" class="material-symbols-rounded">add</span>
  </md-fab>

  <md-dialog id="reader">
    <div slot="headline" id="r-meta" class="eyebrow"></div>
    <div slot="content" class="reader">
      <h2 id="r-title"></h2>
      <p id="r-summary"></p>
    </div>
    <div slot="actions">
      <md-text-button id="r-close" value="close">Kapat</md-text-button>
      <md-filled-tonal-button id="r-save">Kaydet</md-filled-tonal-button>
      <md-filled-button id="r-open" target="_blank" rel="noopener noreferrer">Orijinali aç</md-filled-button>
    </div>
  </md-dialog>

  <md-dialog id="add-dialog">
    <form slot="content" id="add-form" method="dialog" class="add-form">
      <p>RSS veya Atom bağlantısını yapıştırın.</p>
      <md-outlined-text-field id="add-url" label="Bağlantı" type="url" required></md-outlined-text-field>
      <p id="add-error" class="error" role="alert"></p>
    </form>
    <div slot="actions">
      <md-text-button id="add-cancel">Vazgeç</md-text-button>
      <md-filled-button id="add-submit">Ekle</md-filled-button>
    </div>
    <div slot="headline">Kaynak ekle</div>
  </md-dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
