<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6750A4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Launcher">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Launcher</title>
<style>
  :root {
    --primary: #6750A4;
    --on-primary: #FFFFFF;
    --primary-container: #EADDFF;
    --on-primary-container: #21005D;
    --surface: #FEF7FF;
    --surface-high: #ECE6F0;
    --surface-highest: #E6E0E9;
    --on-surface: #1D1B20;
    --on-surface-variant: #49454F;
    --outline: #79747E;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --primary: #D0BCFF;
      --on-primary: #381E72;
      --primary-container: #4F378B;
      --on-primary-container: #EADDFF;
      --surface: #141218;
      --surface-high: #2B2930;
      --surface-highest: #36343B;
      --on-surface: #E6E0E9;
      --on-surface-variant: #CAC4D0;
      --outline: #938F99;
    }
  }
  :root[data-theme="dark"] {
    --primary: #D0BCFF;
    --on-primary: #381E72;
    --primary-container: #4F378B;
    --on-primary-container: #EADDFF;
    --surface: #141218;
    --surface-high: #2B2930;
    --surface-highest: #36343B;
    --on-surface: #E6E0E9;
    --on-surface-variant: #CAC4D0;
    --outline: #938F99;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--surface);
    color: var(--on-surface);
    font-family: Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12vh 16px 24px;
  }

  .search {
    width: 100%;
    max-width: 640px;
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface-highest);
    border-radius: 28px;
    padding: 4px 20px;
    min-height: 56px;
  }
  .search:focus-within { box-shadow: inset 0 0 0 2px var(--primary); }
  .search input {
    flex: 1;
    min-width: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--on-surface);
    font: inherit;
    font-size: 18px;
    padding: 14px 0;
  }
  .search input::placeholder { color: var(--on-surface-variant); }
  .search .hint {
    font-size: 12px;
    color: var(--on-surface-variant);
    border: 1px solid var(--outline);
    border-radius: 8px;
    padding: 2px 6px;
  }

  .results {
    width: 100%;
    max-width: 640px;
    margin-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    list-style: none;
    padding: 0;
  }
  .results li {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 16px;
    border-radius: 20px;
    cursor: pointer;
    transition: background-color 120ms ease;
  }
  .results li:hover,
  .results li[aria-selected="true"] { background: var(--surface-high); }
  .results li[aria-selected="true"] .badge { background: var(--primary); color: var(--on-primary); }
  .badge {
    width: 40px;
    height: 40px;
    flex: none;
    border-radius: 14px;
    background: var(--primary-container);
    color: var(--on-primary-container);
    display: grid;
    place-items: center;
    font-weight: 600;
    font-size: 16px;
    text-transform: uppercase;
    transition: background-color 120ms ease, color 120ms ease;
  }
  .meta { min-width: 0; display: flex; flex-direction: column; }
  .name { font-size: 16px; font-weight: 500; }
  .url {
    font-size: 13px;
    color: var(--on-surface-variant);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .empty {
    margin-top: 12px;
    padding: 12px 16px;
    color: var(--on-surface-variant);
    font-size: 14px;
  }

  @media (max-width: 480px) {
    body { padding-top: 6vh; }
    .search .hint { display: none; }
  }
</style>
</head>
<body>
  <label class="search">
    <input id="q" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
           placeholder="Uygulama adı yaz… (örn: m3e canvas)" autofocus>
    <span class="hint">Enter</span>
  </label>
  <ul id="results" class="results" role="listbox"></ul>

<script>
(function () {
  // Uygulamalar: name = görünen ad, url = açılacak adres, aliases = kısa yazılışlar.
  var DEFAULT_APPS = [
    { name: "M3E Canvas",      url: "https://lnkiai.github.io/m3e-canvas/", aliases: ["m3e", "canvas", "m3e canvas"] },
    { name: "GitHub",          url: "https://github.com/",                  aliases: ["gh", "git"] },
    { name: "Claude",          url: "https://claude.ai/",                   aliases: ["ai", "claude ai"] },
    { name: "YouTube",         url: "https://www.youtube.com/",             aliases: ["yt", "video"] },
    { name: "Gmail",           url: "https://mail.google.com/",             aliases: ["mail", "posta"] },
    { name: "Google Drive",    url: "https://drive.google.com/",            aliases: ["drive"] },
    { name: "Google Takvim",   url: "https://calendar.google.com/",         aliases: ["takvim", "calendar"] },
    { name: "Google Haritalar",url: "https://maps.google.com/",             aliases: ["harita", "maps"] },
    { name: "Çeviri",          url: "https://translate.google.com/",        aliases: ["translate", "ceviri"] },
    { name: "Wikipedia",       url: "https://tr.wikipedia.org/",            aliases: ["wiki", "vikipedi"] }
  ];
  var STORE_KEY = "launcher:apps";

  function loadApps() {
    try {
      var saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
      if (Array.isArray(saved) && saved.length) return saved;
    } catch (e) { /* depolama kapalıysa varsayılanlar kullanılır */ }
    return DEFAULT_APPS;
  }

  var apps = loadApps();
  var input = document.getElementById("q");
  var list = document.getElementById("results");
  var current = [];
  var selected = 0;

  function normalize(s) {
    return String(s).toLocaleLowerCase("tr").replace(/\s+/g, " ").trim();
  }

  // Her kelime ad veya takma adlardan birinde geçmeli; başta eşleşen kelimeler daha yüksek puan alır.
  function search(query) {
    var q = normalize(query);
    if (!q) return [];
    var words = q.split(" ");
    var scored = [];
    apps.forEach(function (app) {
      var keys = [normalize(app.name)].concat((app.aliases || []).map(normalize));
      var score = 0;
      for (var i = 0; i < keys.length; i++) {
        if (keys[i] === q) { score = Math.max(score, 100); }
      }
      if (score < 100) {
        var allMatch = words.every(function (w) {
          return keys.some(function (k) { return k.indexOf(w) !== -1; });
        });
        if (!allMatch) return;
        keys.forEach(function (k) {
          if (k.indexOf(q) === 0) score = Math.max(score, 80);
        });
        score = Math.max(score, 50);
      }
      scored.push({ app: app, score: score });
    });
    scored.sort(function (a, b) { return b.score - a.score; });
    return scored.map(function (s) { return s.app; });
  }

  function looksLikeUrl(s) {
    return /^(https?:\/\/)?[a-z0-9-]+(\.[a-z0-9-]+)+(\/\S*)?$/i.test(s);
  }

  function render() {
    var q = input.value.trim();
    current = search(q);
    if (selected >= current.length) selected = 0;
    list.innerHTML = "";

    if (!q) return;

    if (!current.length) {
      var empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = looksLikeUrl(q)
        ? "Enter ile adrese git: " + q
        : "Eşleşme yok. Enter ile Google'da ara.";
      list.appendChild(empty);
      return;
    }

    current.forEach(function (app, i) {
      var li = document.createElement("li");
      li.setAttribute("role", "option");
      li.setAttribute("aria-selected", i === selected ? "true" : "false");

      var badge = document.createElement("div");
      badge.className = "badge";
      badge.textContent = app.name.charAt(0);

      var meta = document.createElement("div");
      meta.className = "meta";
      var name = document.createElement("div");
      name.className = "name";
      name.textContent = app.name;
      var url = document.createElement("div");
      url.className = "url";
      url.textContent = app.url;
      meta.appendChild(name);
      meta.appendChild(url);

      li.appendChild(badge);
      li.appendChild(meta);
      li.addEventListener("mousedown", function (e) { e.preventDefault(); open(app.url); });
      li.addEventListener("mousemove", function () {
        if (selected !== i) { selected = i; render(); }
      });
      list.appendChild(li);
    });
  }

  function open(url) {
    window.location.assign(url);
  }

  function launch() {
    var q = input.value.trim();
    if (!q) return;
    if (current.length) return open(current[selected].url);
    if (looksLikeUrl(q)) return open(/^https?:\/\//i.test(q) ? q : "https://" + q);
    open("https://www.google.com/search?q=" + encodeURIComponent(q));
  }

  input.addEventListener("input", function () { selected = 0; render(); });

  input.addEventListener("keydown", function (e) {
    if (e.key === "ArrowDown") {
      e.preventDefault();
      if (current.length) { selected = (selected + 1) % current.length; render(); }
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      if (current.length) { selected = (selected - 1 + current.length) % current.length; render(); }
    } else if (e.key === "Enter") {
      e.preventDefault();
      launch();
    } else if (e.key === "Escape") {
      input.value = "";
      selected = 0;
      render();
    }
  });

  // Sayfa açılınca her zaman arama kutusuna odaklan.
  document.addEventListener("keydown", function (e) {
    if (document.activeElement !== input && e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
      input.focus();
    }
  });

  input.focus();

  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    navigator.serviceWorker.register("sw.js").catch(function () { /* çevrimdışı önbellek olmadan da çalışır */ });
  }
})();
</script>
</body>
</html>
